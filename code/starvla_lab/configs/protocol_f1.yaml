# Fixed downstream protocol F1: only the backbone initialisation may vary between runs.
# Consumed by scripts/build_run_matrix.py via starvla_lab.bench.backbone_bench.
protocol:
  head: QwenOFT                      # downstream head, freshly initialised for every run
  max_steps: 30000
  per_device_batch_size: 16
  learning_rate_backbone: 1.0e-5
  learning_rate_head: 1.0e-4
  seeds: [0, 1, 2]
  checkpoint_rule: last              # report the last checkpoint; no cherry-picking
  train_script: starVLA/training/train_starvla.py
  accelerate_config: starVLA/config/deepseeds/deepspeed_zero2.yaml
  run_root_dir: playground/Checkpoints/backbone_bench

benchmarks:
  - name: libero_plus                # primary metric: zero-shot robustness, 10,030 instances
    train_yaml: examples/simBenchmarks/LIBERO-plus/train_files/starvla_libero_plus.yaml
    eval_script: examples/simBenchmarks/LIBERO-plus/eval_files/run_eval.sh
    metric_keys: [success_rate, camera, robot, language, light, background, noise, layout]
    num_gpus: 8
  - name: robotwin_base              # 50 clean demos / task; report clean AND random
    train_yaml: examples/simBenchmarks/Robotwin/train_files/starvla_robotwin_base.yaml
    eval_script: examples/simBenchmarks/Robotwin/eval_files/run_eval.sh
    metric_keys: [success_rate_clean, success_rate_random]
    num_gpus: 16
  - name: robocasa_gr1               # unseen humanoid embodiment; data-fraction curve
    train_yaml: examples/simBenchmarks/Robocasa_tabletop/train_files/starvla_gr1.yaml
    eval_script: examples/simBenchmarks/Robocasa_tabletop/eval_files/run_eval.sh
    metric_keys: [success_rate]
    data_fractions: [0.1, 0.2, 0.5, 1.0]
    num_gpus: 16
