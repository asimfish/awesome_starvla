# F0 · 真实数据微调冒烟（1 卡）：LIBERO-goal，300 步，QwenOFT vs QwenMultiHead，探针只记录不干预（calibrate_only）
#
# 目的：(1) 在真实 LeRobot 数据上跑通 starvla_lab.train.train_starvla_lab + QwenMultiHead 的完整训练循环；
#      (2) 拿到 Qwen3-VL-4B 上"逐层漂移 vs 训练步数"的真实曲线，为 M1 标定 llrd.drift_high / drift_low；
#      (3) 同一数据、同一超参下比较单头与三头的 OFT 动作损失曲线（不做仿真评测）。
#
# 启动（节点上，见 scripts/cluster/run_f0_smoke.sh）：
#   STARVLA_DISABLE_DEEPSPEED=1 WANDB_MODE=disabled python -m starvla_lab.train.train_starvla_lab \
#     --config_yaml <本文件> --framework.name QwenOFT --run_id f0_oft
#   ... --framework.name QwenMultiHead --framework.action_model.state_dim 0 --run_id f0_multihead
#
# 与 StarVLA examples/simBenchmarks/LIBERO/train_files/starvla_cotrain_libero.yaml 的差别：单 loader（无 vlm_data）、
# 300 步、batch 8 / 无梯度累积、VLAct 式冻结（视觉编码器 + LLM 前 18 层，写成 StarVLA 原生可解析的 19 条精确路径）、
# 不存 checkpoint。
#
# 探针（v3，按 F0 v2 诊断修正，见 experiments/results/f0_libero_goal_smoke/README.md §3）：每 25 次更新在固定的 32 样本
# 探针批上测 36 层 1−CKA；主指标 token 级（每个有效 token 是一个样本，≤4096 个固定位置），次指标 mean-pool；提取时把
# 预训练 embed_tokens 临时换回（否则 40 余行 prompt 词嵌入的更新会主导整条曲线）；探针批跨场景：从 LIBERO-goal +
# LIBERO-spatial 两套里按指令轮询抽样（20 个任务、2 个场景），训练数据仍只有 LIBERO-goal。

run_id: f0_libero_goal_smoke
run_root_dir: /home/dataset-assist-0/liyufeng/awesome_starvla_work/checkpoints
seed: 42
wandb_entity: none
wandb_project: awesome_starvla
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT                     # 每次运行用 --framework.name 覆盖：QwenOFT | QwenMultiHead | QwenMultiHeadLab
  qwenvl:
    base_vlm: /home/dataset-assist-0/wangpeishuo/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
  action_model:
    action_dim: 7
    state_dim: 7                    # QwenMultiHead 请覆盖为 0（state 走文本，GR00T 头不建 state_encoder）
    action_horizon: 8
  # 以下仅 QwenMultiHead 读取（QwenOFT 忽略）
  heads:
    oft:   {enabled: true, loss_weight: 1.0}
    gr00t: {enabled: true, loss_weight: 1.0}
    pi:    {enabled: true, loss_weight: 1.0}
  predict_head: oft
  mask_oft_queries_for_fm_heads: false
  wrap_aware: {enabled: false}      # LIBERO 是 7 维 delta EE，无周期关节
  unified_layout: {enabled: false}

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /home/dataset-assist-0/liyufeng/datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_goal
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av
    obs_image_size: [224, 224]

trainer:
  max_train_steps: 300
  num_warmup_steps: 30
  save_interval: 100000             # 冒烟不落盘 checkpoint（4B 骨干 ≈ 10 GB）
  eval_interval: 50
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # VLAct 配方 (a)：视觉编码器 + LLM 前 18 层；等价于 vlact_ext 语法 "…visual,llm_layers_below:18"，此处展开成原生精确路径
  freeze_modules: 'qwen_vl_interface.model.model.visual,qwen_vl_interface.model.model.language_model.layers.0,qwen_vl_interface.model.model.language_model.layers.1,qwen_vl_interface.model.model.language_model.layers.2,qwen_vl_interface.model.model.language_model.layers.3,qwen_vl_interface.model.model.language_model.layers.4,qwen_vl_interface.model.model.language_model.layers.5,qwen_vl_interface.model.model.language_model.layers.6,qwen_vl_interface.model.model.language_model.layers.7,qwen_vl_interface.model.model.language_model.layers.8,qwen_vl_interface.model.model.language_model.layers.9,qwen_vl_interface.model.model.language_model.layers.10,qwen_vl_interface.model.model.language_model.layers.11,qwen_vl_interface.model.model.language_model.layers.12,qwen_vl_interface.model.model.language_model.layers.13,qwen_vl_interface.model.model.language_model.layers.14,qwen_vl_interface.model.model.language_model.layers.15,qwen_vl_interface.model.model.language_model.layers.16,qwen_vl_interface.model.model.language_model.layers.17'
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  lab:
    mode: single
    probes:
      enabled: true
      every_n_steps: 25
      calibrate_only: true
      record_initial: true
      probe_batch_size: 32
      representation: token             # 主指标：token 级 CKA
      secondary_representation: pooled  # 次指标：mean-pool（v1/v2 的口径），写入 JSONL 的 drift_secondary
      token_subset: all
      max_tokens: 4096
      restore_pretrained_embeddings: true
      probe_data_mix: "libero_goal_no_noops_1.0.0_lerobot:libero_franka,libero_spatial_no_noops_1.0.0_lerobot:libero_franka"
      stratify_by_instruction: true
      pool_factor: 4
      jsonl_path: /home/dataset-assist-0/liyufeng/awesome_starvla_work/checkpoints/f0_libero_goal_smoke/lab_probes.jsonl
