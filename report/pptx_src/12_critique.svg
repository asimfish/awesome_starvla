    <rect x="680" y="569" width="8" height="8" fill="#DE8F05"/>
    <text x="704" y="580">同名基线不一致：RoboTwin Base OFT<tspan x="704" dy="28">61.7（VLAct）vs 50.38（StarVLA README）</tspan></text>
  </g>
