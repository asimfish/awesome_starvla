    <text x="84" y="44" font-size="14" fill="#5F6772">03 · StarVLA-α</text>
    <text x="84" y="86" font-size="34" font-weight="bold" fill="#1B1F24">最简基线 Qwen3-VL-4B + MLP 头，追平或超过更复杂系统</text>
    <line x1="64" y1="112" x2="1216" y2="112" stroke="#D5D9DE" stroke-width="1"/>
  </g>
  <g id="lead" data-pptx-bounds="64 126 1152 34">
    <text x="84" y="150" font-size="22" font-weight="bold" fill="#0173B2">骨干够强时，最简单的头就够用；短板只在低数据 + 关节角控制</text>
  </g>
  <g id="design-note" data-pptx-bounds="64 168 1152 28">
    <text x="64" y="188" font-size="18" fill="#5F6772">设计：原始 RGB + 指令；z-score 归一化；无状态 / 历史 / 机器人预训练；骨干 lr 1e-5、头 lr 1e-4、cosine、≤100k 步</text>
  </g>
