  <g id="alpha-notes" data-pptx-bounds="64 508 1152 160" font-size="22" fill="#1B1F24">
    <rect x="84" y="518" width="8" height="8" fill="#0173B2"/>
    <text x="108" y="530">唯一输掉的一格：RoboTwin Base（50 clean/任务）50.3 &lt; π0.5 60.2<tspan x="108" dy="28">—— <tspan fill="#DE8F05" font-weight="bold">低数据 + 关节角控制是短板</tspan></tspan></text>
    <rect x="84" y="580" width="8" height="8" fill="#0173B2"/>
    <text x="108" y="592">四个基准数据合训一个 generalist，GR1 反而 <tspan fill="#029E73" font-weight="bold">+3.5</tspan></text>
    <rect x="84" y="614" width="8" height="8" fill="#0173B2"/>
    <text x="108" y="626">规模与优化：4B→8B 增益 &lt; 1 点（4B 是甜点）；batch 64→1024 使 GR1 <tspan fill="#029E73" font-weight="bold">+19</tspan> 点，<tspan x="108" dy="28">比模型规模影响更大；真机 RoboChallenge ARX5：SR 33.6 vs π0.5 12.7</tspan></text>
  </g>
