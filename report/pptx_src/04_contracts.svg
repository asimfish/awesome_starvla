  <g id="starvla-notes" data-pptx-bounds="64 470 1152 200" font-size="22" fill="#1B1F24">
    <rect x="84" y="482" width="8" height="8" fill="#0173B2"/>
    <text x="108" y="494">每个 framework 文件可单独运行（smoke test）；<tspan x="108" dy="30">YAML + 点路径命令行覆盖（--framework.qwenvl.base_vlm）</tspan></text>
    <rect x="84" y="546" width="8" height="8" fill="#0173B2"/>
    <text x="108" y="558">冻结 = 模块名正则；分模块学习率 = trainer.learning_rate 字典</text>
    <rect x="84" y="580" width="8" height="8" fill="#0173B2"/>
    <text x="108" y="592">评测：WebSocket 策略服务器 + 基准侧薄适配器（model2libero_interface.py 等），仿真与真机共用</text>
    <rect x="84" y="614" width="8" height="8" fill="#0173B2"/>
    <text x="108" y="626">13 个仿真基准 + 真机（Franka / Realman / Unitree G1 / RoboChallenge）</text>
    <rect x="84" y="648" width="8" height="8" fill="#0173B2"/>
    <text x="108" y="660">多节点扩展：GR00T 头从 8 卡到 256 卡效率 <tspan font-weight="bold" fill="#0173B2">79.1%</tspan>，数据量驱动的训练可放心扩到数百卡</text>
