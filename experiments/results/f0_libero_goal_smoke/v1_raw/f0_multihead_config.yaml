datasets:
  vla_data:
    data_mix: libero_goal
    data_root_dir: /home/dataset-assist-0/liyufeng/datasets/LEROBOT_LIBERO_DATA
    dataset_py: lerobot_datasets
    per_device_batch_size: 8
    video_backend: torchvision_av
framework:
  action_model:
    action_dim: 7
    state_dim: 0
    action_horizon: 8
    action_hidden_dim: 2560
    add_pos_embed: true
    max_seq_len: 1024
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    repeated_diffusion_steps: 4
    future_action_window_size: 7
    past_action_window_size: 0
  heads:
    oft:
      enabled: true
      loss_weight: 1.0
      action_model:
        action_model_type: MLP
    gr00t:
      enabled: true
      loss_weight: 1.0
      action_model:
        action_model_type: DiT-B
        hidden_size: 1024
        diffusion_model_cfg:
          cross_attention_dim: null
          dropout: 0.2
          final_dropout: true
          interleave_self_attention: true
          norm_type: ada_norm
          num_layers: 16
          output_dim: 1024
          positional_embeddings: null
    pi:
      enabled: true
      loss_weight: 1.0
      action_model:
        action_model_type: LayerwiseFM
        diffusion_model_cfg:
          action_dit_hidden_dim: 1024
          dropout: 0.2
          final_dropout: true
          interleave_self_attention: false
          norm_type: ada_norm
          positional_embeddings: null
          attention_head_dim: 64
  mask_oft_queries_for_fm_heads: false
  name: QwenMultiHead
  predict_head: oft
  qwenvl:
    attn_implementation: sdpa
    base_vlm: /home/dataset-assist-0/wangpeishuo/Pretrained_models/Qwen3-VL-4B-Instruct
    num_vl_layers: 36
    vl_hidden_dim: 2560
  unified_layout:
    enabled: false
    unified_dim: 20
    layouts: null
  wrap_aware:
    enabled: false
    period: 2.0
    fm_sample_loss_weight: 1.0
output_dir: /home/dataset-assist-0/liyufeng/awesome_starvla_work/checkpoints/f0_multihead
run_id: f0_multihead
run_root_dir: /home/dataset-assist-0/liyufeng/awesome_starvla_work/checkpoints
seed: 42
trainer:
  freeze_modules: qwen_vl_interface.model.model.visual,qwen_vl_interface.model.model.language_model.layers.0,qwen_vl_interface.model.model.language_model.layers.1,qwen_vl_interface.model.model.language_model.layers.2,qwen_vl_interface.model.model.language_model.layers.3,qwen_vl_interface.model.model.language_model.layers.4,qwen_vl_interface.model.model.language_model.layers.5,qwen_vl_interface.model.model.language_model.layers.6,qwen_vl_interface.model.model.language_model.layers.7,qwen_vl_interface.model.model.language_model.layers.8,qwen_vl_interface.model.model.language_model.layers.9,qwen_vl_interface.model.model.language_model.layers.10,qwen_vl_interface.model.model.language_model.layers.11,qwen_vl_interface.model.model.language_model.layers.12,qwen_vl_interface.model.model.language_model.layers.13,qwen_vl_interface.model.model.language_model.layers.14,qwen_vl_interface.model.model.language_model.layers.15,qwen_vl_interface.model.model.language_model.layers.16,qwen_vl_interface.model.model.language_model.layers.17
  lab:
    probes:
      calibrate_only: true
      enabled: true
      every_n_steps: 50
      jsonl_path: /home/dataset-assist-0/liyufeng/awesome_starvla_work/checkpoints/f0_multihead/lab_probes.jsonl
      probe_batch_size: 16
  learning_rate:
    action_model: 0.0001
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
  lr_scheduler_type: cosine_with_min_lr
  max_train_steps: 300
  num_warmup_steps: 30
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
