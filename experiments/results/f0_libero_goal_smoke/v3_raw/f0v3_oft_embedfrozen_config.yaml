seed: 42
wandb_entity: none
wandb_project: awesome_starvla
is_debug: false
version_id: '0.21'
framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /home/dataset-assist-0/wangpeishuo/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
  action_model:
    action_model_type: MLP
    action_dim: 7
    action_hidden_dim: 2560
    future_action_window_size: 7
    past_action_window_size: 0
    state_dim: 7
    action_horizon: 8
  heads:
    oft:
      enabled: true
      loss_weight: 1.0
    gr00t:
      enabled: true
      loss_weight: 1.0
    pi:
      enabled: true
