    video_backend: torchvision_av
    obs_image_size:
    - 224
    - 224
trainer:
  max_train_steps: 300
  num_warmup_steps: 30
  save_interval: 100000
  eval_interval: 50
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
