  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  lab:
    mode: single
    probes:
      enabled: true
      every_n_steps: 25
      calibrate_only: true
      record_initial: true
      probe_batch_size: 32
      representation: token
      secondary_representation: pooled
      token_subset: all
      max_tokens: 4096
      restore_pretrained_embeddings: true
      probe_data_mix: libero_goal_no_noops_1.0.0_lerobot:libero_franka,libero_spatial_no_noops_1.0.0_lerobot:libero_franka
      stratify_by_instruction: true
      pool_factor: 4
      jsonl_path: /home/dataset-assist-0/liyufeng/awesome_starvla_work/checkpoints/f0v3_oft_embedfrozen/lab_probes.jsonl
