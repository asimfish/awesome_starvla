datasets:
  vla_data:
    data_mix: libero_goal
    data_root_dir: /home/dataset-assist-0/liyufeng/datasets/LEROBOT_LIBERO_DATA
    dataset_py: lerobot_datasets
    per_device_batch_size: 8
    video_backend: torchvision_av
framework:
  action_model:
    action_dim: 7
    action_hidden_dim: 2560
    action_horizon: 8
    action_model_type: MLP
  name: QwenOFT
  qwenvl:
    attn_implementation: sdpa
    base_vlm: /home/dataset-assist-0/wangpeishuo/Pretrained_models/Qwen3-VL-4B-Instruct
output_dir: /home/dataset-assist-0/liyufeng/awesome_starvla_work/checkpoints/f0v2_oft
run_id: f0v2_oft
run_root_dir: /home/dataset-assist-0/liyufeng/awesome_starvla_work/checkpoints
seed: 42
trainer:
  freeze_modules: qwen_vl_interface.model.model.visual,qwen_vl_interface.model.model.language_model.layers.0,qwen_vl_interface.model.model.language_model.layers.1,qwen_vl_interface.model.model.language_model.layers.2,qwen_vl_interface.model.model.language_model.layers.3,qwen_vl_interface.model.model.language_model.layers.4,qwen_vl_interface.model.model.language_model.layers.5,qwen_vl_interface.model.model.language_model.layers.6,qwen_vl_interface.model.model.language_model.layers.7,qwen_vl_interface.model.model.language_model.layers.8,qwen_vl_interface.model.model.language_model.layers.9,qwen_vl_interface.model.model.language_model.layers.10,qwen_vl_interface.model.model.language_model.layers.11,qwen_vl_interface.model.model.language_model.layers.12,qwen_vl_interface.model.model.language_model.layers.13,qwen_vl_interface.model.model.language_model.layers.14,qwen_vl_interface.model.model.language_model.layers.15,qwen_vl_interface.model.model.language_model.layers.16,qwen_vl_interface.model.model.language_model.layers.17
  lab:
    probes:
      calibrate_only: true
      enabled: true
      every_n_steps: 25
      jsonl_path: /home/dataset-assist-0/liyufeng/awesome_starvla_work/checkpoints/f0v2_oft/lab_probes.jsonl
      probe_batch_size: 32
  learning_rate:
    action_model: 0.0001
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
  lr_scheduler_type: cosine_with_min_lr
  max_train_steps: 300
  num_warmup_steps: 30
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
